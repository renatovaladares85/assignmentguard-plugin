name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  glpi:
    name: GLPI ${{ matrix.glpi-version }} / PHP ${{ matrix.php-version }} / ${{ matrix.db-image }}
    strategy:
      fail-fast: false
      matrix:
        glpi-version: ["10.0.x"]
        php-version: ["7.4"]
        db-image: ["mysql:5.7", "mariadb:10.2"]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php-version }}-glpi-${{ matrix.glpi-version }}
      options: --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-${{ matrix.db-image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show runtime
        run: php --version
      - name: Unit tests
        run: php tests/unit.php
      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  lifecycle-glpi-10:
    name: GLPI ${{ matrix.glpi-version }} lifecycle and regression
    strategy:
      fail-fast: false
      matrix:
        glpi-version: ["10.0.20", "10.0.21", "10.0.22", "10.0.23", "10.0.24", "10.0.25", "10.0.26"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GLPI ${{ matrix.glpi-version }}
        uses: actions/checkout@v7
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi-version }}
          path: glpi
      - name: Checkout plugin with its GLPI key
        uses: actions/checkout@v7
        with:
          path: glpi/plugins/assignmentguard
      - name: Prepare GLPI workspace
        working-directory: glpi
        run: |
          make init-override
          sudo chown -R 1000:1000 .
      - name: Start GLPI ${{ matrix.glpi-version }}
        working-directory: glpi
        run: |
          # GLPI 10.0.21+ declares an optional OpenLDAP development service
          # whose unpinned upstream `latest` image is no longer published.
          # Assignment Guard's lifecycle coverage needs only the app and db
          # services (the app itself depends on db), so keep the bootstrap
          # limited to those required services.
          docker compose build --no-cache app
          docker compose up -d app db
          make vendor db-install test-db-install
      - name: Verify discovery and lifecycle
        working-directory: glpi
        run: |
          test -f plugins/assignmentguard/setup.php
          docker compose exec -T app bin/console list --raw | grep -q '^plugin:install'
          docker compose exec -T app bin/console plugin:install assignmentguard -u glpi
          docker compose exec -T app bin/console plugin:enable assignmentguard
      - name: Run standalone safety regressions
        working-directory: glpi
        run: docker compose exec -T app php plugins/assignmentguard/tests/unit.php
      - name: Run GLPI ${{ matrix.glpi-version }} same-write SLA regression
        working-directory: glpi
        run: |
          docker compose exec -T app ./vendor/bin/atoum -bf tests/bootstrap.php -mcn 1 -ncc -f plugins/assignmentguard/tests/functional/AssignmentGuardSameWriteTest.php
      - name: Verify plugin lifecycle teardown
        working-directory: glpi
        run: |
          docker compose exec -T app bin/console plugin:disable assignmentguard
          docker compose exec -T app bin/console plugin:uninstall assignmentguard
      - name: Stop GLPI
        if: always()
        working-directory: glpi
        run: docker compose down --volumes

  integration-matrix:
    name: GLPI 10.0.26 / ${{ matrix.db-image }} / Behaviors 2.7.8 / Escalade ${{ matrix.escalade-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - escalade-version: "2.9.18"
            db-image: "mysql:5.7"
          - escalade-version: "2.9.19"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.20"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.21"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.22"
            db-image: "mariadb:10.2"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GLPI 10.0.26
        uses: actions/checkout@v7
        with:
          repository: glpi-project/glpi
          ref: 10.0.26
          path: glpi
      - name: Checkout Assignment Guard
        uses: actions/checkout@v7
        with:
          path: glpi/plugins/assignmentguard
      - name: Checkout Behaviors 2.7.8
        uses: actions/checkout@v7
        with:
          repository: InfotelGLPI/behaviors
          ref: 2.7.8
          path: glpi/plugins/behaviors
      - name: Checkout Escalade ${{ matrix.escalade-version }}
        uses: actions/checkout@v7
        with:
          repository: pluginsGLPI/escalade
          ref: ${{ matrix.escalade-version }}
          path: glpi/plugins/escalade
      - name: Prepare GLPI integration workspace
        working-directory: glpi
        run: |
          make init-override
          cat > docker-compose.override.yaml <<'EOF'
          services:
            db:
              image: ${{ matrix.db-image }}
              environment:
                MYSQL_ROOT_PASSWORD: glpi
                MYSQL_DATABASE: glpi
                MYSQL_USER: glpi
                MYSQL_PASSWORD: glpi
          EOF
          sudo chown -R 1000:1000 .
      - name: Start GLPI 10.0.26 with ${{ matrix.db-image }}
        working-directory: glpi
        run: |
          docker compose build --no-cache app
          docker compose up -d app db
          make vendor db-install test-db-install
      - name: Record exact integration environment
        working-directory: glpi
        run: |
          printf 'GLPI ref: '; git rev-parse HEAD
          printf 'Behaviors ref: '; git -C plugins/behaviors rev-parse HEAD
          printf 'Escalade ref: '; git -C plugins/escalade rev-parse HEAD
          docker compose exec -T app php --version
          docker compose exec -T db sh -c 'mariadb --version || mysql --version'
      - name: Install and enable tested plugins
        working-directory: glpi
        run: |
          for plugin in assignmentguard behaviors escalade; do
            docker compose exec -T app bin/console plugin:install "$plugin" -u glpi
            docker compose exec -T app bin/console plugin:enable "$plugin"
          done
      - name: Run standalone and unsupported-version safety gates
        working-directory: glpi
        run: docker compose exec -T app php plugins/assignmentguard/tests/unit.php
      - name: Run external integration policy regression
        working-directory: glpi
        run: |
          docker compose exec -e ASSIGNMENTGUARD_ESCALADE_VERSION=${{ matrix.escalade-version }} -T app \
            ./vendor/bin/atoum -bf tests/bootstrap.php -mcn 1 -ncc \
            -f plugins/assignmentguard/tests/functional/AssignmentGuardIntegrationPolicyTest.php
      - name: Verify integration lifecycle teardown
        working-directory: glpi
        run: |
          for plugin in assignmentguard escalade behaviors; do
            docker compose exec -T app bin/console plugin:disable "$plugin"
            docker compose exec -T app bin/console plugin:uninstall "$plugin"
          done
      - name: Stop GLPI integration workspace
        if: always()
        working-directory: glpi
        run: docker compose down --volumes
