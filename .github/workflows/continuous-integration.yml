name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  glpi:
    name: GLPI ${{ matrix.glpi-version }} / PHP ${{ matrix.php-version }} / ${{ matrix.db-image }}
    strategy:
      fail-fast: false
      matrix:
        glpi-version: ["10.0.x"]
        php-version: ["7.4"]
        db-image: ["mysql:5.7", "mariadb:10.2"]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php-version }}-glpi-${{ matrix.glpi-version }}
      options: --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-${{ matrix.db-image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show runtime
        run: php --version
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install development quality tools
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Unit tests
        run: composer run test
      - name: PHP syntax
        run: composer run lint
      - name: Coding standards
        run: composer run cs
      - name: Static analysis
        run: composer run stan

  release-package:
    name: Release package reproducibility
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-7.4-glpi-10.0.x
      options: --user github-actions-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build identical release candidates
        run: |
          first_output_dir=$(mktemp -d)
          second_output_dir=$(mktemp -d)
          bash tools/build-release-package.sh --output "$first_output_dir"
          bash tools/build-release-package.sh --output "$second_output_dir"
          first_archive="$first_output_dir/assignmentguard-0.1.1-rc.1.tar.gz"
          second_archive="$second_output_dir/assignmentguard-0.1.1-rc.1.tar.gz"
          cmp --silent "$first_archive" "$second_archive"
          bash tools/verify-release-package.sh "$first_archive"
          bash tools/verify-release-package.sh "$second_archive"

  lifecycle-glpi-10:
    name: GLPI ${{ matrix.glpi-version }} lifecycle and regression
    strategy:
      fail-fast: false
      matrix:
        glpi-version: ["10.0.20", "10.0.21", "10.0.22", "10.0.23", "10.0.24", "10.0.25", "10.0.26"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GLPI ${{ matrix.glpi-version }}
        uses: actions/checkout@v7
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi-version }}
          path: glpi
      - name: Checkout plugin with its GLPI key
        uses: actions/checkout@v7
        with:
          path: glpi/plugins/assignmentguard
      - name: Build and extract clean release candidate
        working-directory: glpi
        run: |
          mkdir -p plugins/package-test-source
          cp -a plugins/assignmentguard/tests plugins/package-test-source/
          output_dir=$(mktemp -d)
          bash plugins/assignmentguard/tools/build-release-package.sh --output "$output_dir"
          archive=$(find "$output_dir" -maxdepth 1 -name 'assignmentguard-*.tar.gz' -print -quit)
          bash plugins/assignmentguard/tools/verify-release-package.sh "$archive"
          rm -rf plugins/assignmentguard
          tar -xzf "$archive" -C plugins
          test -f plugins/assignmentguard/setup.php
          test ! -e plugins/assignmentguard/tests
          printf 'Release candidate: %s\n' "$(basename "$archive")" >> "$GITHUB_STEP_SUMMARY"
          printf 'Size: %s bytes\n' "$(wc -c < "$archive" | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-256: %s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare GLPI workspace
        working-directory: glpi
        run: |
          make init-override
          sudo chown -R 1000:1000 .
      - name: Start GLPI ${{ matrix.glpi-version }}
        working-directory: glpi
        run: |
          # GLPI 10.0.21+ declares an optional OpenLDAP development service
          # whose unpinned upstream `latest` image is no longer published.
          # Assignment Guard's lifecycle coverage needs only the app and db
          # services (the app itself depends on db), so keep the bootstrap
          # limited to those required services.
          docker compose build --no-cache app
          docker compose up -d app db
          make vendor db-install test-db-install
      - name: Verify discovery and lifecycle
        working-directory: glpi
        run: |
          test -f plugins/assignmentguard/setup.php
          docker compose exec -T app bin/console list --raw | grep -q '^plugin:install'
          docker compose exec -T app bin/console plugin:install assignmentguard -u glpi
          docker compose exec -T app bin/console plugin:enable assignmentguard
      - name: Run GLPI ${{ matrix.glpi-version }} same-write SLA regression
        working-directory: glpi
        run: |
          docker compose exec -T app ./vendor/bin/atoum -bf tests/bootstrap.php -mcn 1 -ncc \
            -f plugins/package-test-source/tests/functional/AssignmentGuardSameWriteTest.php
      - name: Run GLPI ${{ matrix.glpi-version }} configuration form HTTP regression
        working-directory: glpi
        run: |
          docker compose exec -T app php \
            plugins/package-test-source/tests/functional/ConfigFormHttpRegression.php \
            /var/www/glpi http://localhost
      - name: Verify plugin lifecycle teardown
        working-directory: glpi
        run: |
          docker compose exec -T app bin/console plugin:disable assignmentguard
          docker compose exec -T app bin/console plugin:enable assignmentguard
          docker compose exec -T app bin/console plugin:disable assignmentguard
          docker compose exec -T app bin/console plugin:uninstall assignmentguard
      - name: Stop GLPI
        if: always()
        working-directory: glpi
        run: docker compose down --volumes

  upgrade-glpi-10:
    name: GLPI ${{ matrix.glpi-version }} upgrade 0.1.0 to 0.1.1
    strategy:
      fail-fast: false
      matrix:
        glpi-version: ["10.0.20", "10.0.26"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GLPI ${{ matrix.glpi-version }}
        uses: actions/checkout@v7
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi-version }}
          path: glpi
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          path: glpi/plugins/assignmentguard
      - name: Build candidate and validate public 0.1.0 asset
        working-directory: glpi
        run: |
          mkdir -p plugins/package-test-source
          cp -a plugins/assignmentguard/tests plugins/package-test-source/
          output_dir=$(mktemp -d)
          bash plugins/assignmentguard/tools/build-release-package.sh --output "$output_dir"
          candidate_archive=$(find "$output_dir" -maxdepth 1 -name 'assignmentguard-0.1.1-rc.1.tar.gz' -print -quit)
          bash plugins/assignmentguard/tools/verify-release-package.sh "$candidate_archive"
          cp "$candidate_archive" /tmp/assignmentguard-0.1.1-rc.1.tar.gz
          curl --fail --location --retry 3 --output /tmp/assignmentguard-0.1.0.tar.gz \
            https://github.com/renatovaladares85/assignmentguard-plugin/releases/download/0.1.0/assignmentguard-0.1.0.tar.gz
          printf '%s  %s\n' \
            e87109cd5907c536d83f3e3804ee7d9f3d8d735b6efdfbe2b680b7379f6656aa \
            /tmp/assignmentguard-0.1.0.tar.gz | sha256sum --check --strict
          rm -rf plugins/assignmentguard
          tar -xzf /tmp/assignmentguard-0.1.0.tar.gz -C plugins
      - name: Prepare GLPI workspace
        working-directory: glpi
        run: |
          make init-override
          sudo chown -R 1000:1000 .
      - name: Start GLPI ${{ matrix.glpi-version }}
        working-directory: glpi
        run: |
          docker compose build --no-cache app
          docker compose up -d app db
          make vendor db-install test-db-install
      - name: Install and configure public 0.1.0
        working-directory: glpi
        run: |
          docker compose exec -T app bin/console plugin:install assignmentguard -u glpi
          docker compose exec -T app bin/console plugin:enable assignmentguard
          seeded_value=$(docker compose exec -T app php \
            plugins/package-test-source/tests/functional/ReleaseUpgradeRegression.php \
            /var/www/glpi seed | sed -n 's/^upgrade_config_seeded=//p')
          test "$seeded_value" = 0 -o "$seeded_value" = 1
          printf 'ASSIGNMENTGUARD_UPGRADE_CONFIG_VALUE=%s\n' "$seeded_value" >> "$GITHUB_ENV"
      - name: Upgrade to candidate through the native GLPI lifecycle
        working-directory: glpi
        run: |
          docker compose exec -T app bin/console plugin:disable assignmentguard
          sudo rm -rf plugins/assignmentguard
          tar -xzf /tmp/assignmentguard-0.1.1-rc.1.tar.gz -C plugins
          docker compose exec -T app bin/console plugin:install assignmentguard -u glpi
          docker compose exec -T app bin/console plugin:enable assignmentguard
          docker compose exec -T app php \
            plugins/package-test-source/tests/functional/ReleaseUpgradeRegression.php \
            /var/www/glpi verify "$ASSIGNMENTGUARD_UPGRADE_CONFIG_VALUE"
      - name: Run configuration HTTP/CSRF regression after upgrade
        working-directory: glpi
        run: |
          docker compose exec -T app php \
            plugins/package-test-source/tests/functional/ConfigFormHttpRegression.php \
            /var/www/glpi http://localhost
      - name: Run same-write SLA regression after upgrade
        working-directory: glpi
        run: |
          docker compose exec -T app ./vendor/bin/atoum -bf tests/bootstrap.php -mcn 1 -ncc \
            -f plugins/package-test-source/tests/functional/AssignmentGuardSameWriteTest.php
      - name: Verify candidate lifecycle teardown
        working-directory: glpi
        run: |
          docker compose exec -T app bin/console plugin:disable assignmentguard
          docker compose exec -T app bin/console plugin:enable assignmentguard
          docker compose exec -T app bin/console plugin:disable assignmentguard
          docker compose exec -T app bin/console plugin:uninstall assignmentguard
      - name: Stop GLPI
        if: always()
        working-directory: glpi
        run: docker compose down --volumes

  integration-matrix:
    name: GLPI 10.0.26 / ${{ matrix.db-image }} / Behaviors 2.7.8 / Escalade ${{ matrix.escalade-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - escalade-version: "2.9.18"
            db-image: "mysql:5.7"
          - escalade-version: "2.9.19"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.20"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.21"
            db-image: "mariadb:10.2"
          - escalade-version: "2.9.22"
            db-image: "mariadb:10.2"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GLPI 10.0.26
        uses: actions/checkout@v7
        with:
          repository: glpi-project/glpi
          ref: 10.0.26
          path: glpi
      - name: Checkout Assignment Guard
        uses: actions/checkout@v7
        with:
          path: glpi/plugins/assignmentguard
      - name: Build and extract clean release candidate
        working-directory: glpi
        run: |
          mkdir -p plugins/package-test-source
          cp -a plugins/assignmentguard/tests plugins/package-test-source/
          output_dir=$(mktemp -d)
          bash plugins/assignmentguard/tools/build-release-package.sh --output "$output_dir"
          archive=$(find "$output_dir" -maxdepth 1 -name 'assignmentguard-*.tar.gz' -print -quit)
          bash plugins/assignmentguard/tools/verify-release-package.sh "$archive"
          rm -rf plugins/assignmentguard
          tar -xzf "$archive" -C plugins
          test -f plugins/assignmentguard/setup.php
          test ! -e plugins/assignmentguard/tests
          printf 'Release candidate: %s\n' "$(basename "$archive")" >> "$GITHUB_STEP_SUMMARY"
          printf 'Size: %s bytes\n' "$(wc -c < "$archive" | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-256: %s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout Behaviors 2.7.8
        uses: actions/checkout@v7
        with:
          repository: InfotelGLPI/behaviors
          ref: 2.7.8
          path: glpi/plugins/behaviors
      - name: Checkout Escalade ${{ matrix.escalade-version }}
        uses: actions/checkout@v7
        with:
          repository: pluginsGLPI/escalade
          ref: ${{ matrix.escalade-version }}
          path: glpi/plugins/escalade
      - name: Prepare GLPI integration workspace
        working-directory: glpi
        run: |
          make init-override
          cat > docker-compose.override.yaml <<'EOF'
          services:
            db:
              image: ${{ matrix.db-image }}
              environment:
                MYSQL_ROOT_PASSWORD: glpi
                MYSQL_DATABASE: glpi
                MYSQL_USER: glpi
                MYSQL_PASSWORD: glpi
          EOF
          sudo chown -R 1000:1000 .
      - name: Start GLPI 10.0.26 with ${{ matrix.db-image }}
        working-directory: glpi
        run: |
          docker compose build --no-cache app
          docker compose up -d app db
          make vendor db-install test-db-install
      - name: Record exact integration environment
        working-directory: glpi
        run: |
          printf 'GLPI ref: '; git rev-parse HEAD
          printf 'Behaviors ref: '; git -C plugins/behaviors rev-parse HEAD
          printf 'Escalade ref: '; git -C plugins/escalade rev-parse HEAD
          docker compose exec -T app php --version
          docker compose exec -T db sh -c 'mariadb --version || mysql --version'
      - name: Install and enable tested plugins
        working-directory: glpi
        run: |
          docker compose exec -T app sh -lc 'cd plugins/escalade && composer install --no-dev --no-interaction --prefer-dist'
          for plugin in assignmentguard behaviors escalade; do
            docker compose exec -T app bin/console plugin:install "$plugin" -u glpi
            docker compose exec -T app bin/console plugin:enable "$plugin"
          done
      - name: Run package integration policy regression
        working-directory: glpi
        run: |
          docker compose exec -e ASSIGNMENTGUARD_ESCALADE_VERSION=${{ matrix.escalade-version }} -T app \
            ./vendor/bin/atoum -bf plugins/package-test-source/tests/functional/IntegrationBootstrap.php -mcn 1 -ncc \
            -f plugins/package-test-source/tests/functional/AssignmentGuardIntegrationPolicyTest.php
      - name: Verify integration lifecycle teardown
        working-directory: glpi
        run: |
          for plugin in assignmentguard escalade behaviors; do
            docker compose exec -T app bin/console plugin:disable "$plugin"
            docker compose exec -T app bin/console plugin:uninstall "$plugin"
          done
      - name: Stop GLPI integration workspace
        if: always()
        working-directory: glpi
        run: docker compose down --volumes
